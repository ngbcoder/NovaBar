<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NovaBar Island Expanded</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: transparent;
    color: #f4f5f7;
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  .panel {
    margin: 0 auto;
    width: calc(100% - 20px);
    padding: 14px 16px;
    border-radius: 18px;
    background: rgba(12, 16, 24, 0.96);
    backdrop-filter: blur(24px) saturate(200%);
    box-shadow: 0 16px 48px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.18);
  }
  .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 11px; color: rgba(255,255,255,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .controls { display: flex; gap: 8px; margin-top: 10px; justify-content: center; }
  .btn {
    width: 32px; height: 32px; border: none; border-radius: 50%;
    background: rgba(255,255,255,0.08); color: #f4f5f7; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .btn .material-icons-round { font-size: 18px; }
  .btn:hover { background: rgba(255,255,255,0.16); }
  .overlay { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
  .overlay-title { font-size: 12px; font-weight: 600; }
  .overlay-body { font-size: 11px; color: rgba(255,255,255,0.7); }
  .hidden { display: none; }
  .battery { margin-top: 8px; font-size: 11px; color: rgba(255,255,255,0.6); text-align: center; }
  .volume { margin-top: 8px; }
  .vol-row { display: flex; align-items: center; gap: 8px; }
  .vol-row label { font-size: 11px; color: rgba(255,255,255,0.7); }
  .vol-row input[type="range"] { flex: 1 1 auto; accent-color: #f0883e; }
  .session { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; }
  .session span { flex: 0 0 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session input { flex: 1 1 auto; accent-color: #f0883e; }
</style>
</head>
<body>
  <div class="panel">
    <div id="media-block">
      <div class="title" id="title">Nothing playing</div>
      <div class="artist" id="artist"></div>
      <div class="controls">
        <button class="btn" id="prev"><span class="material-icons-round">skip_previous</span></button>
        <button class="btn" id="toggle"><span class="material-icons-round">pause</span></button>
        <button class="btn" id="next"><span class="material-icons-round">skip_next</span></button>
        <button class="btn" id="settings"><span class="material-icons-round">settings</span></button>
        <button class="btn" id="close"><span class="material-icons-round">close</span></button>
      </div>
      <div class="battery" id="battery">Battery: --%</div>
      <div class="volume" id="volume">
        <div class="vol-row">
          <label>Master</label>
          <input type="range" id="master-volume" min="0" max="1" step="0.01">
          <button class="btn" id="master-mute"><span class="material-icons-round">volume_up</span></button>
        </div>
        <div id="sessions"></div>
      </div>
    </div>
    <div class="overlay hidden" id="overlay">
      <div class="overlay-title" id="overlay-title"></div>
      <div class="overlay-body" id="overlay-body"></div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
