<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NovaBar Dock</title>
<style>
  :root {
    --icon: 56px;        /* set from the daemon via dock.size */
    --radius: 18px;
    --panel: rgba(38, 40, 46, 0.72);
    --border: rgba(255, 255, 255, 0.12);
    --fg: #f2f3f5;
    --dim: rgba(255, 255, 255, 0.62);
    --accent: #f0883e;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    /* The window spans the monitor and nothing should be selectable or scrollable in the
       empty space around the dock. */
    overflow: hidden;
    user-select: none;
    cursor: default;
    font: 12px "Segoe UI", system-ui, sans-serif;
    /* Windows renders WebView2 on a transparent surface; this keeps the corners of the
       window from showing as a faint rectangle. */
    -webkit-font-smoothing: antialiased;
  }

  /* The panel: a floating rounded pill, centred, hugging the bottom. */
  #dock {
    position: absolute;
    left: 50%;
    bottom: 6px;
    transform: translateX(-50%);
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 7px 9px;
    max-width: calc(100% - 24px);
    overflow: visible;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px) saturate(160%);
  }

  .tile {
    position: relative;
    width: var(--icon);
    height: var(--icon);
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.09);
    color: var(--fg);
    font: inherit;
    /* macOS-style magnification: neighbours grow as the pointer approaches. */
    transform-origin: bottom center;
    transition: transform 110ms cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: transform;
  }
  .tile:active { filter: brightness(1.25); }

  .glyph {
    font-size: calc(var(--icon) * 0.42);
    font-weight: 600;
    letter-spacing: 0.3px;
    pointer-events: none;
    user-select: none;
  }

  /* Running indicator, as a dot under the icon. */
  .dot {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--dim);
    pointer-events: none;
  }
  .tile.active .dot { background: var(--accent); width: 5px; height: 5px; }

  /* Thin separator between pinned apps and running windows. */
  .sep {
    width: 1px;
    align-self: stretch;
    margin: 4px 4px;
    background: var(--border);
    flex: 0 0 auto;
  }

  /* Label above the icon, like the real Dock's tooltip. */
  .tile-label {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 12px;
    padding: 4px 9px;
    border-radius: 6px;
    background: rgba(22, 24, 28, 0.96);
    border: 1px solid var(--border);
    opacity: 0;
    pointer-events: none;
    transition: opacity 110ms ease;
    z-index: 20;
  }
  .tile:hover .tile-label { opacity: 1; }

  /* Volume indicator, above the dot. */
  .tile-volume {
    position: absolute;
    bottom: -6px;
    left: 22%;
    width: 56%;
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.16);
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    transition: opacity 110ms ease;
  }
  .tile-volume-fill { display: block; height: 100%; background: var(--fg); }
  .tile-volume.muted .tile-volume-fill { background: var(--accent); }
  .tile:hover .tile-volume { opacity: 1; }

  .empty {
    color: var(--dim);
    font-size: 11px;
    padding: 0 10px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div id="dock"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
