<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NovaBar Settings</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2127;
    --fg: #e8eaed;
    --dim: #9aa0a6;
    --accent: #f0883e;
    --border: rgba(255, 255, 255, 0.09);
    --danger: #f2645a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    user-select: none;
    overflow: hidden;
  }
  header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.2px; }
  .hint { color: var(--dim); font-size: 12px; }
  #rows { padding: 8px 22px 28px; overflow-y: auto; height: calc(100% - 62px); }
  .row {
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .row:last-child { border-bottom: none; }
  .text { flex: 1 1 auto; min-width: 0; }
  .label { font-size: 13.5px; }
  .help { color: var(--dim); font-size: 11.5px; margin-top: 3px; }
  .control { flex: 0 0 auto; }

  select, input[type="text"], input[type="number"] {
    background: var(--panel);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 10px;
    font: inherit;
    min-width: 150px;
  }
  select:focus, input:focus { outline: 1px solid var(--accent); border-color: transparent; }

  /* Toggle */
  .switch {
    position: relative; width: 42px; height: 23px; flex: 0 0 auto;
    background: #34383f; border-radius: 999px; cursor: pointer;
    transition: background 140ms ease; border: none;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 17px; height: 17px; border-radius: 50%;
    background: #fff; transition: transform 140ms ease;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(19px); }

  /* Hotkey capture */
  .hotkey {
    min-width: 150px; text-align: center; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 12px; font-size: 13px;
  }
  .hotkey.capturing { border-color: var(--accent); color: var(--accent); }
  .hotkey.clash { border-color: var(--danger); color: var(--danger); }
  .hotkey:disabled { opacity: 0.5; cursor: not-allowed; }

  .note {
    margin: 10px 22px 0; padding: 10px 12px;
    border-left: 3px solid var(--accent); border-radius: 0 7px 7px 0;
    background: rgba(240, 136, 62, 0.09);
    color: var(--dim); font-size: 12px;
  }
  #toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    padding: 9px 16px; border-radius: 8px; font-size: 12.5px;
    background: #2a2e35; border: 1px solid var(--border);
    opacity: 0; transition: opacity 180ms ease; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #toast.bad { border-color: var(--danger); color: #ffd9d5; }
  .protected .label::after {
    content: 'protected'; margin-left: 8px; font-size: 9.5px;
    text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--accent); border: 1px solid rgba(240,136,62,0.4);
    border-radius: 4px; padding: 1px 5px; vertical-align: 1.5px;
  }
</style>
</head>
<body>
  <header>
    <h1>Settings</h1>
    <span class="hint">Esc closes</span>
  </header>
  <div id="note" class="note" hidden></div>
  <div id="rows"></div>
  <div id="toast"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
