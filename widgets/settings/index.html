<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NovaBar Settings</title>
<style>
  :root {
    color-scheme: dark;
    --base: rgb(24, 26, 33);
    --panel: rgba(255, 255, 255, 0.07);
    --fg: #f4f5f7;
    --dim: rgba(255, 255, 255, 0.55);
    --accent: #f0883e;
    --border: rgba(255, 255, 255, 0.09);
    --edge: rgba(255, 255, 255, 0.14);
    --danger: #f2645a;
    --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--base);
    color: var(--fg);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overflow: hidden;
  }

  /* The window is opaque, so the glass look is gradients over a solid base. */
  body {
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(255, 255, 255, 0.10), transparent 60%),
      linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0) 35%),
      var(--base);
    box-shadow:
      inset 0 0 0 1px var(--edge),
      inset 0 1px 0 rgba(255, 255, 255, 0.26);
    animation: fade-in 200ms ease-out both;
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  header {
    flex: 0 0 auto;
    padding: 20px 26px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: 0.1px; }
  .hint { color: var(--dim); font-size: 12px; display: inline-flex; align-items: center; gap: 7px; }

  kbd {
    font: inherit;
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
    color: var(--dim);
    padding: 3px 7px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border);
    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.25);
  }

  .note {
    flex: 0 0 auto;
    margin: 12px 22px 0;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(240, 136, 62, 0.28);
    border-left: 3px solid var(--accent);
    background: linear-gradient(180deg, rgba(240, 136, 62, 0.14), rgba(240, 136, 62, 0.07));
    color: rgba(255, 255, 255, 0.78);
    font-size: 12.5px;
  }
  .note[hidden] { display: none; }

  #rows {
    flex: 1 1 auto;
    min-height: 0;
    padding: 10px 14px 30px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
  }
  #rows::-webkit-scrollbar { width: 8px; }
  #rows::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 4px; }

  .row {
    padding: 13px 12px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 18px;
    transition: background 120ms ease;
  }
  .row + .row { margin-top: 2px; }
  .row:hover, .row:focus-within { background: rgba(255, 255, 255, 0.05); }
  .text { flex: 1 1 auto; min-width: 0; }
  .label { font-size: 14px; font-weight: 500; }
  .help { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .control { flex: 0 0 auto; }

  select, input[type="text"], input[type="number"] {
    background: var(--panel);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font: inherit;
    min-width: 150px;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  select:hover, input:hover { border-color: var(--edge); }
  select:focus-visible, input:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(240, 136, 62, 0.25);
  }
  input[type="number"] { appearance: textfield; text-align: right; }
  input[type="number"]::-webkit-inner-spin-button { opacity: 0.5; }

  /* Toggle */
  .switch {
    position: relative; width: 44px; height: 25px; flex: 0 0 auto;
    background: rgba(255, 255, 255, 0.14);
    border-radius: 999px; cursor: pointer; border: none; padding: 0;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    transition: background 160ms ease, box-shadow 160ms ease;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 19px; height: 19px; border-radius: 50%;
    background: linear-gradient(180deg, #fff, #e4e6ea);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    transition: transform 200ms var(--ease-out);
  }
  .switch.on {
    background: linear-gradient(180deg, #f59a56, var(--accent));
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25), 0 0 12px rgba(240, 136, 62, 0.35);
  }
  .switch.on::after { transform: translateX(19px); }
  .switch:focus-visible, .hotkey:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* Hotkey capture */
  .hotkey {
    min-width: 150px; text-align: center; cursor: pointer;
    color: var(--fg);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 500;
    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.25);
    transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
  }
  .hotkey:hover { background: rgba(255, 255, 255, 0.11); }
  .hotkey.capturing { border-color: var(--accent); color: var(--accent); background: rgba(240, 136, 62, 0.1); }
  .hotkey.clash { border-color: var(--danger); color: var(--danger); background: rgba(242, 100, 90, 0.1); }
  .hotkey:disabled { opacity: 0.5; cursor: not-allowed; }

  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(6px);
    padding: 10px 18px; border-radius: 12px; font-size: 12.5px;
    background: rgba(40, 43, 52, 0.96);
    border: 1px solid var(--edge);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    opacity: 0; pointer-events: none;
    transition: opacity 180ms ease, transform 220ms var(--ease-out);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.bad { border-color: rgba(242, 100, 90, 0.6); color: #ffd9d5; }

  /* A pill rather than tracked-out capitals. */
  .protected .label::after {
    content: 'Protected'; margin-left: 9px; font-size: 11px; font-weight: 500;
    color: var(--accent);
    background: rgba(240, 136, 62, 0.12);
    border: 1px solid rgba(240, 136, 62, 0.32);
    border-radius: 999px; padding: 1px 8px; vertical-align: 1px;
  }

  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
    .switch, .switch::after, #toast, .row, select, input, .hotkey { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>Settings</h1>
    <span class="hint"><kbd>Esc</kbd> Close</span>
  </header>
  <div id="note" class="note" hidden></div>
  <div id="rows"></div>
  <div id="toast"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
