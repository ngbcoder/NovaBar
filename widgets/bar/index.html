<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NovaBar</title>
  <style>
    :root {
      --bg: rgba(12, 14, 20, 0.78);
      --bg-top: rgba(255, 255, 255, 0.06);
      --accent: #2ee6a8;
      --accent-soft: rgba(46, 230, 168, 0.18);
      --accent-ink: #061a14;
      --text: #f0f2f7;
      --dim: #8b92a8;
      --chip: rgba(255, 255, 255, 0.07);
      --chip-hover: rgba(255, 255, 255, 0.14);
      --hairline: rgba(255, 255, 255, 0.1);
      --radius: 10px;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      pointer-events: none;
      background: transparent;
    }

    body {
      height: 40px;
      color: var(--text);
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    .bar {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 12px;
      position: relative;
      background:
        linear-gradient(180deg, var(--bg-top), transparent 55%),
        var(--bg);
      backdrop-filter: blur(28px) saturate(180%);
      border-bottom: 1px solid var(--hairline);
      box-shadow:
        0 1px 0 rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    /* Brand mark — four-point star */
    .brand {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px 0 6px;
      height: 28px;
      border-radius: 999px;
      font-weight: 650;
      font-size: 13px;
      letter-spacing: 0.15px;
      cursor: default;
      transition: background 140ms var(--ease);
      z-index: 2;
    }
    .brand:hover { background: var(--chip); }
    .brand::before {
      content: "";
      width: 15px;
      height: 15px;
      background: var(--accent);
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      filter: drop-shadow(0 0 6px rgba(46, 230, 168, 0.55));
    }

    /* Workspaces — numbered circular pills */
    .workspaces {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      box-shadow: inset 0 0 0 1px var(--hairline);
      z-index: 2;
    }

    .ws {
      pointer-events: auto;
      width: 24px;
      height: 24px;
      min-width: 24px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--dim);
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        background 160ms var(--ease),
        color 160ms var(--ease),
        box-shadow 160ms var(--ease),
        transform 120ms var(--ease);
    }
    .ws:hover {
      background: var(--chip-hover);
      color: var(--text);
    }
    .ws.active {
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      box-shadow:
        0 0 12px rgba(46, 230, 168, 0.45),
        0 2px 6px rgba(0, 0, 0, 0.25);
    }
    .ws:active { transform: scale(0.92); }

    /* ── Dynamic Island (embedded, always centered, Vorssaint glass aesthetic) ─── */
    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    @keyframes island-pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 10px var(--accent); }
    }

    .island {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 32px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(20, 24, 33, 0.72);
      backdrop-filter: blur(24px) saturate(200%);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 16px rgba(0, 0, 0, 0.25);
      transition: all 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: default;
    }
    .island.has-media {
      padding: 0 14px;
      gap: 10px;
      background: rgba(14, 18, 26, 0.86);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.65),
        inset 0 0 0 1px rgba(255, 255, 255, 0.18),
        0 0 24px rgba(46, 230, 168, 0.22);
    }
    .island.expanded {
      padding: 0 14px;
      gap: 10px;
      background: rgba(12, 16, 24, 0.94);
      box-shadow:
        0 16px 48px rgba(0, 0, 0, 0.75),
        inset 0 0 0 1px rgba(255, 255, 255, 0.24),
        0 0 32px rgba(46, 230, 168, 0.3);
    }

    .island-clock {
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      font-size: 12.5px;
      letter-spacing: 0.3px;
      color: var(--text);
      white-space: nowrap;
    }
    .island-date {
      font-size: 10.5px;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .island-sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--dim);
      opacity: 0.5;
      flex: none;
    }

    .media-indicator {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: island-pulse 2s infinite ease-in-out;
      flex: none;
    }

    /* Media segment — hidden until something plays */
    .media {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      opacity: 1;
    }
    .media[hidden] { display: none; }

    .media-info {
      min-width: 0;
      max-width: 200px;
      text-align: left;
      line-height: 1.15;
    }
    .media-title, .media-artist {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-title { font-size: 12px; font-weight: 600; color: var(--text); }
    .media-artist { font-size: 10.5px; color: var(--dim); }

    /* Transport controls: hidden by default, revealed on hover or click-expand */
    .media-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: none;
      opacity: 0;
      max-width: 0;
      overflow: hidden;
      transition: opacity 160ms var(--ease), max-width 250ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .island:hover .media-controls,
    .island.expanded .media-controls {
      opacity: 1;
      max-width: 120px;
    }

    .media-btn {
      pointer-events: auto;
      flex: none;
      width: 24px;
      height: 24px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 140ms var(--ease), transform 100ms var(--ease);
    }
    .media-icon {
      width: 11px;
      height: 11px;
      fill: currentColor;
      display: block;
    }
    .media-icon-pause { display: none; }
    .media-btn.is-playing .media-icon-play { display: none; }
    .media-btn.is-playing .media-icon-pause { display: block; }
    .media-btn:hover { background: var(--chip-hover); }
    .media-btn:active { transform: scale(0.9); }
    .media-btn:disabled { opacity: 0.28; cursor: default; background: transparent; transform: none; }
    #media-toggle {
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 0 10px rgba(46, 230, 168, 0.35);
    }
    #media-toggle:hover { background: #4aefb8; }

    /* Tray */
    .tray {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 2;
    }

    /* Offline badge */
    .offline {
      pointer-events: auto;
      display: none;
      align-items: center;
      gap: 6px;
      height: 22px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(248, 113, 113, 0.14);
      color: #fca5a5;
      font-size: 11px;
      font-weight: 600;
    }
    .offline::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }
    .offline.show { display: inline-flex; }

    /* Focus rings */
    .brand:focus-visible,
    .ws:focus-visible,
    .media-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="brand">NovaBar</div>

    <div class="workspaces" id="workspaces"></div>

    <div class="center">
      <div class="island" id="island">
        <span class="island-clock" id="island-clock">--:--:--</span>
        <span class="island-date" id="island-date"></span>

        <div class="media" id="media" hidden>
          <span class="island-sep"></span>
          <span class="media-indicator"></span>
          <div class="media-info">
            <div class="media-title" id="media-title"></div>
            <div class="media-artist" id="media-artist"></div>
          </div>
          <div class="media-controls" id="media-controls">
            <button class="media-btn" id="media-prev" title="Previous track" aria-label="Previous track">
              <svg class="media-icon" viewBox="0 0 12 12" aria-hidden="true">
                <rect x="1.4" y="2" width="1.6" height="8" rx="0.5" /><path d="M9 2 L3.8 6 L9 10 Z" />
              </svg>
            </button>
            <button class="media-btn" id="media-toggle" title="Play or pause" aria-label="Play or pause">
              <svg class="media-icon media-icon-play" viewBox="0 0 12 12" aria-hidden="true">
                <path d="M2.8 1.7 L10.6 6 L2.8 10.3 Z" />
              </svg>
              <svg class="media-icon media-icon-pause" viewBox="0 0 12 12" aria-hidden="true">
                <rect x="3.3" y="1.9" width="2" height="8.2" rx="0.5" />
                <rect x="6.7" y="1.9" width="2" height="8.2" rx="0.5" />
              </svg>
            </button>
            <button class="media-btn" id="media-next" title="Next track" aria-label="Next track">
              <svg class="media-icon" viewBox="0 0 12 12" aria-hidden="true">
                <path d="M3 2 L8.2 6 L3 10 Z" /><rect x="9" y="2" width="1.6" height="8" rx="0.5" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="tray">
      <span class="offline" id="offline">Offline</span>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
