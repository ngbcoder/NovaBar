<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NovaBar</title>
  <style>
    :root {
      --bg: rgba(12, 14, 20, 0.78);
      --bg-top: rgba(255, 255, 255, 0.06);
      --accent: #2ee6a8;
      --accent-soft: rgba(46, 230, 168, 0.18);
      --accent-ink: #061a14;
      --text: #f0f2f7;
      --dim: #8b92a8;
      --chip: rgba(255, 255, 255, 0.07);
      --chip-hover: rgba(255, 255, 255, 0.14);
      --hairline: rgba(255, 255, 255, 0.1);
      --radius: 10px;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      pointer-events: none;
      background: transparent;
    }

    body {
      height: 40px;
      color: var(--text);
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    .bar {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 12px;
      background:
        linear-gradient(180deg, var(--bg-top), transparent 55%),
        var(--bg);
      backdrop-filter: blur(28px) saturate(180%);
      border-bottom: 1px solid var(--hairline);
      box-shadow:
        0 1px 0 rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    /* Brand mark — four-point star matching the screenshot */
    .brand {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px 0 6px;
      height: 28px;
      border-radius: 999px;
      font-weight: 650;
      font-size: 13px;
      letter-spacing: 0.15px;
      cursor: default;
      transition: background 140ms var(--ease);
    }
    .brand:hover { background: var(--chip); }
    .brand::before {
      content: "";
      width: 15px;
      height: 15px;
      background: var(--accent);
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      filter: drop-shadow(0 0 6px rgba(46, 230, 168, 0.55));
    }

    /* Workspaces — numbered circular pills like the target */
    .workspaces {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      box-shadow: inset 0 0 0 1px var(--hairline);
    }

    .ws {
      pointer-events: auto;
      width: 24px;
      height: 24px;
      min-width: 24px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--dim);
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        background 160ms var(--ease),
        color 160ms var(--ease),
        box-shadow 160ms var(--ease),
        transform 120ms var(--ease);
    }
    .ws:hover {
      background: var(--chip-hover);
      color: var(--text);
    }
    .ws.active {
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      box-shadow:
        0 0 12px rgba(46, 230, 168, 0.45),
        0 2px 6px rgba(0, 0, 0, 0.25);
    }
    .ws:active { transform: scale(0.92); }

    /* Window title — centered, quiet */
    .title {
      flex: 1;
      min-width: 0;
      text-align: center;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      font-weight: 500;
      padding: 0 8px;
      letter-spacing: 0.1px;
    }

    .tray {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Compact media pill */
    .media {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 280px;
      padding: 3px 12px 3px 4px;
      border-radius: 999px;
      background: var(--chip);
      box-shadow: inset 0 0 0 1px var(--hairline);
      flex-direction: row-reverse;
    }
    .media[hidden] { display: none; }

    .media-info {
      min-width: 0;
      text-align: left;
      line-height: 1.15;
      padding-left: 6px;
    }
    .media-title, .media-artist {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-title { font-size: 12px; font-weight: 600; color: var(--text); }
    .media-artist { font-size: 10.5px; color: var(--dim); }

    .media-btn {
      pointer-events: auto;
      flex: none;
      width: 24px;
      height: 24px;
      /* The default button padding is 6px inline, which pushes the icon off
         centre no matter how the content is aligned. */
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 140ms var(--ease), transform 100ms var(--ease);
    }
    /* The transport icons are drawn rather than typed.
       A font cannot centre a symbol: the play and pause glyphs sit low in their
       line box, which left the pause bars about two pixels below the middle of
       the button, and the play triangle a pixel low and to the left. Drawn
       icons have their own geometry, so they sit where they are put. */
    .media-icon {
      width: 11px;
      height: 11px;
      fill: currentColor;
      display: block;
    }
    .media-icon-pause { display: none; }
    .media-btn.is-playing .media-icon-play { display: none; }
    .media-btn.is-playing .media-icon-pause { display: block; }
    .media-btn:hover { background: var(--chip-hover); }
    .media-btn:active { transform: scale(0.9); }
    .media-btn:disabled { opacity: 0.28; cursor: default; background: transparent; transform: none; }
    #media-toggle {
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 0 10px rgba(46, 230, 168, 0.35);
    }
    #media-toggle:hover { background: #4aefb8; }

    /* Clock */
    .clock {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      font-size: 12.5px;
      padding: 0 6px;
      letter-spacing: 0.3px;
      color: var(--text);
    }

    /* Offline badge */
    .offline {
      pointer-events: auto;
      display: none;
      align-items: center;
      gap: 6px;
      height: 22px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(248, 113, 113, 0.14);
      color: #fca5a5;
      font-size: 11px;
      font-weight: 600;
    }
    .offline::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }
    .offline.show { display: inline-flex; }

    /* Focus rings */
    .brand:focus-visible,
    .ws:focus-visible,
    .media-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="brand">NovaBar</div>

    <div class="workspaces" id="workspaces"></div>

    <div class="title" id="window-title">NovaBar</div>

    <div class="tray">
      <span class="offline" id="offline">Offline</span>

      <div class="media" id="media" hidden>
        <div class="media-info">
          <div class="media-title" id="media-title"></div>
          <div class="media-artist" id="media-artist"></div>
        </div>
        <button class="media-btn" id="media-next" title="Next track" aria-label="Next track">
          <svg class="media-icon" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M3 2 L8.2 6 L3 10 Z" /><rect x="9" y="2" width="1.6" height="8" rx="0.5" />
          </svg>
        </button>
        <button class="media-btn" id="media-toggle" title="Play or pause" aria-label="Play or pause">
          <svg class="media-icon media-icon-play" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2.8 1.7 L10.6 6 L2.8 10.3 Z" />
          </svg>
          <svg class="media-icon media-icon-pause" viewBox="0 0 12 12" aria-hidden="true">
            <rect x="3.3" y="1.9" width="2" height="8.2" rx="0.5" />
            <rect x="6.7" y="1.9" width="2" height="8.2" rx="0.5" />
          </svg>
        </button>
        <button class="media-btn" id="media-prev" title="Previous track" aria-label="Previous track">
          <svg class="media-icon" viewBox="0 0 12 12" aria-hidden="true">
            <rect x="1.4" y="2" width="1.6" height="8" rx="0.5" /><path d="M9 2 L3.8 6 L9 10 Z" />
          </svg>
        </button>
      </div>

      <div class="clock" id="clock">--:--:--</div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
