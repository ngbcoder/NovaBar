<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NovaBar</title>
  <style>
    :root {
      --bg: rgba(12, 14, 20, 0.78);
      --bg-top: rgba(255, 255, 255, 0.06);
      --accent: #2ee6a8;
      --accent-soft: rgba(46, 230, 168, 0.18);
      --accent-ink: #061a14;
      --text: #f0f2f7;
      --dim: #8b92a8;
      --chip: rgba(255, 255, 255, 0.07);
      --chip-hover: rgba(255, 255, 255, 0.14);
      --hairline: rgba(255, 255, 255, 0.1);
      --radius: 10px;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      pointer-events: none;
      background: transparent;
    }

    body {
      height: 40px;
      color: var(--text);
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    .bar {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 12px;
      position: relative;
      background:
        linear-gradient(180deg, var(--bg-top), transparent 55%),
        var(--bg);
      backdrop-filter: blur(28px) saturate(180%);
      border-bottom: 1px solid var(--hairline);
      box-shadow:
        0 1px 0 rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    /* Brand mark — four-point star */
    .brand {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px 0 6px;
      height: 28px;
      border-radius: 999px;
      font-weight: 650;
      font-size: 13px;
      letter-spacing: 0.15px;
      cursor: default;
      transition: background 140ms var(--ease);
      z-index: 2;
    }
    .brand:hover { background: var(--chip); }
    .brand::before {
      content: "";
      width: 15px;
      height: 15px;
      background: var(--accent);
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      filter: drop-shadow(0 0 6px rgba(46, 230, 168, 0.55));
    }

    /* Workspaces — numbered circular pills */
    .workspaces {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      box-shadow: inset 0 0 0 1px var(--hairline);
      z-index: 2;
    }

    .ws {
      pointer-events: auto;
      width: 24px;
      height: 24px;
      min-width: 24px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--dim);
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        background 160ms var(--ease),
        color 160ms var(--ease),
        box-shadow 160ms var(--ease),
        transform 120ms var(--ease);
    }
    .ws:hover {
      background: var(--chip-hover);
      color: var(--text);
    }
    .ws.active {
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      box-shadow:
        0 0 12px rgba(46, 230, 168, 0.45),
        0 2px 6px rgba(0, 0, 0, 0.25);
    }
    .ws:active { transform: scale(0.92); }

    /* ── Dynamic Island ─── */
    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    .island {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      height: 32px;
      padding: 0 13px;
      border-radius: 999px;
      background: rgba(20, 24, 33, 0.72);
      backdrop-filter: blur(24px) saturate(200%);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 16px rgba(0, 0, 0, 0.25);
      transition:
        padding 340ms cubic-bezier(0.34, 1.56, 0.64, 1),
        background 320ms var(--ease),
        box-shadow 320ms var(--ease),
        transform 220ms var(--ease);
      cursor: pointer;
      overflow: hidden;
    }
    .island:active {
      transform: scale(0.97);
    }
    .island.has-media {
      padding: 0 9px 0 12px;
      background: rgba(14, 18, 26, 0.86);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.65),
        inset 0 0 0 1px rgba(255, 255, 255, 0.18),
        0 0 24px rgba(46, 230, 168, 0.22);
    }
    .island.has-media:hover {
      transform: translateY(-1px);
      box-shadow:
        0 16px 44px rgba(0, 0, 0, 0.7),
        inset 0 0 0 1px rgba(255, 255, 255, 0.22),
        0 0 30px rgba(46, 230, 168, 0.28);
    }

    .island-clock {
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      font-size: 12.5px;
      letter-spacing: 0.3px;
      color: var(--text);
      white-space: nowrap;
    }
    .island-date {
      font-size: 10.5px;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .island-sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--dim);
      opacity: 0.5;
      flex: none;
    }

    /* Weather segment */
    .weather {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }
    .weather[hidden] { display: none; }
    .weather-temp {
      font-variant-numeric: tabular-nums;
    }

    /* The now-playing block.
       The island lives in a 40px bar, so it can only grow sideways. Width is animated
       through a grid track: 0fr -> 1fr is the one way CSS can move between "nothing"
       and "exactly as wide as the content" without measuring it in script. */
    .media-slot {
      display: grid;
      grid-template-columns: 0fr;
      min-width: 0;
      opacity: 0;
      transform: translateX(-5px);
      visibility: hidden;
      transition:
        grid-template-columns 360ms cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 170ms var(--ease),
        transform 360ms cubic-bezier(0.34, 1.56, 0.64, 1),
        visibility 0s linear 380ms;
    }
    .island.has-media .media-slot {
      grid-template-columns: 1fr;
      opacity: 1;
      transform: none;
      visibility: visible;
      transition-delay: 0s;
    }

    .media {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      overflow: hidden;
    }
    .media[hidden] { display: none; }

    .media-art {
      position: relative;
      flex: none;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      overflow: hidden;
      background: linear-gradient(145deg, #303a4d 0%, #131820 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.1),
        0 2px 8px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: scale(0.55) rotate(-14deg);
      transition:
        opacity 200ms var(--ease),
        transform 420ms cubic-bezier(0.34, 1.8, 0.5, 1);
    }
    .island.has-media .media-art {
      opacity: 1;
      transform: none;
      transition-delay: 70ms;
    }
    .media-art img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .media-art.is-empty img { display: none; }
    .media-art:not(.is-empty) .media-art-fallback { display: none; }
    .media-art-fallback {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 13px;
      height: 13px;
      fill: rgba(255, 255, 255, 0.42);
    }

    .media-info {
      min-width: 0;
      max-width: 210px;
      text-align: left;
      line-height: 1.2;
      opacity: 0;
      transform: translateX(-6px);
      transition:
        opacity 200ms var(--ease),
        transform 360ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .island.has-media .media-info {
      opacity: 1;
      transform: none;
      transition-delay: 60ms;
    }
    .media-title, .media-artist {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-title { font-size: 12px; font-weight: 600; color: var(--text); }
    .media-artist { font-size: 10.5px; color: var(--dim); }

    .media-controls {
      display: flex;
      align-items: center;
      gap: 3px;
      flex: none;
      opacity: 0;
      transform: translateX(7px);
      transition:
        opacity 190ms var(--ease),
        transform 340ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .island.has-media .media-controls {
      opacity: 1;
      transform: none;
      transition-delay: 100ms;
    }

    /* Three bars rather than a dot: they read as "this is playing" at a glance, and
       they freeze when the track does. */
    .media-eq {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 11px;
      flex: none;
    }
    .media-eq i {
      display: block;
      width: 2px;
      height: 4px;
      border-radius: 1px;
      background: var(--accent);
      opacity: 0.85;
    }
    .island.is-playing .media-eq i {
      animation: eq 900ms ease-in-out infinite;
    }
    .island.is-playing .media-eq i:nth-child(2) { animation-delay: 140ms; }
    .island.is-playing .media-eq i:nth-child(3) { animation-delay: 280ms; }
    @keyframes eq {
      0%, 100% { height: 3px; }
      50% { height: 11px; }
    }

    .media-btn {
      pointer-events: auto;
      flex: none;
      width: 24px;
      height: 24px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 140ms var(--ease), transform 100ms var(--ease);
    }
    .media-icon {
      width: 11px;
      height: 11px;
      fill: currentColor;
      display: block;
    }
    .media-icon-pause { display: none; }
    .media-btn.is-playing .media-icon-play { display: none; }
    .media-btn.is-playing .media-icon-pause { display: block; }
    .media-btn:hover { background: var(--chip-hover); }
    .media-btn:active { transform: scale(0.9); }
    .media-btn:disabled { opacity: 0.28; cursor: default; background: transparent; transform: none; }
    #media-toggle {
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 0 10px rgba(46, 230, 168, 0.35);
    }
    #media-toggle:hover { background: #4aefb8; }

    .tray {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 2;
    }

    .offline {
      pointer-events: auto;
      display: none;
      align-items: center;
      gap: 6px;
      height: 22px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(248, 113, 113, 0.14);
      color: #fca5a5;
      font-size: 11px;
      font-weight: 600;
    }
    .offline::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }
    .offline.show { display: inline-flex; }

    .brand:focus-visible,
    .ws:focus-visible,
    .media-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
<div class="bar">
  <div class="brand">NovaBar</div>

  <div class="workspaces" id="workspaces"></div>

  <div class="center">
    <div class="island" id="island" role="button" tabindex="0"
         title="Quick settings" aria-label="Open quick settings">
      <span class="island-clock" id="island-clock">--:--:--</span>
      <span class="island-date" id="island-date"></span>

      <div class="weather" id="weather" hidden>
        <span class="island-sep"></span>
        <span class="weather-temp" id="weather-temp">--°</span>
      </div>

      <div class="media-slot" aria-hidden="true">
        <div class="media" id="media">
          <span class="island-sep"></span>
          <span class="media-eq" aria-hidden="true"><i></i><i></i><i></i></span>
          <div class="media-art is-empty" id="media-art">
            <svg class="media-art-fallback" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="7.6" cy="17" r="2.7" />
              <rect x="9.3" y="4.4" width="1.9" height="12.6" rx="0.95" />
              <path d="M11.2 4.4c2.9 0.2 5.2 1.8 6.1 4l-1.8 0.9c-0.7-1.5-2.3-2.5-4.3-2.7Z" />
            </svg>
            <img id="media-art-img" alt="" decoding="async" referrerpolicy="no-referrer">
          </div>
          <div class="media-info" id="media-info">
            <div class="media-title" id="media-title"></div>
            <div class="media-artist" id="media-artist"></div>
          </div>
          <div class="media-controls" id="media-controls">
            <button class="media-btn" id="media-prev" title="Previous track" aria-label="Previous track">
              <svg class="media-icon" viewBox="0 0 12 12" aria-hidden="true">
                <rect x="1.4" y="2" width="1.6" height="8" rx="0.5" /><path d="M9 2 L3.8 6 L9 10 Z" />
              </svg>
            </button>
            <button class="media-btn" id="media-toggle" title="Play or pause" aria-label="Play or pause">
              <svg class="media-icon media-icon-play" viewBox="0 0 12 12" aria-hidden="true">
                <path d="M2.8 1.7 L10.6 6 L2.8 10.3 Z" />
              </svg>
              <svg class="media-icon media-icon-pause" viewBox="0 0 12 12" aria-hidden="true">
                <rect x="3.3" y="1.9" width="2" height="8.2" rx="0.5" />
                <rect x="6.7" y="1.9" width="2" height="8.2" rx="0.5" />
              </svg>
            </button>
            <button class="media-btn" id="media-next" title="Next track" aria-label="Next track">
              <svg class="media-icon" viewBox="0 0 12 12" aria-hidden="true">
                <path d="M3 2 L8.2 6 L3 10 Z" /><rect x="9" y="2" width="1.6" height="8" rx="0.5" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tray">
    <span class="offline" id="offline">Offline</span>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
