<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NovaBar Launcher</title>
  <style>
    :root {
      --bg: rgb(20, 22, 26);
      --border: rgba(255, 255, 255, 0.10);
      --text: #f3f4f6;
      --dim: #9ca3af;
      --accent: #3b82f6;
      --hover: rgba(255, 255, 255, 0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    body { display: flex; flex-direction: column; }

    .search {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .search input {
      pointer-events: auto;
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
    }
    .search input::placeholder { color: var(--dim); }
    .hint {
      font-size: 11px;
      color: var(--dim);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
    }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 10px;
      scrollbar-width: thin;
    }
    .list::-webkit-scrollbar { width: 8px; }
    .list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

    .row {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .row.sel { background: var(--accent); }
    .row.sel .row-sub { color: rgba(255,255,255,0.85); }

    .glyph {
      width: 30px; height: 30px;
      flex: 0 0 auto;
      border-radius: 7px;
      background: var(--hover);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--dim);
    }
    .row.sel .glyph { background: rgba(255,255,255,0.22); color: #fff; }

    .row-text { min-width: 0; flex: 1; }
    .row-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .kind {
      flex: 0 0 auto;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--dim);
    }
    .row.sel .kind { color: rgba(255,255,255,0.9); }

    .empty {
      padding: 28px 18px;
      text-align: center;
      color: var(--dim);
      font-size: 13px;
    }

    .footer {
      flex: 0 0 auto;
      display: flex;
      gap: 16px;
      padding: 8px 18px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--dim);
    }
  </style>
</head>
<body>
  <div class="search">
    <input id="q" type="text" placeholder="Search applications and running windows" autofocus spellcheck="false" />
    <span class="hint">Enter to launch</span>
  </div>

  <div class="list" id="list"></div>

  <div class="footer">
    <span>Up / Down to move</span>
    <span>Enter to launch</span>
    <span>Esc to close</span>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
