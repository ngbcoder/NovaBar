<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NovaBar Launcher</title>
  <style>
    :root {
      --fg: #f4f5f7;
      --text: var(--fg);
      --dim: rgba(255, 255, 255, 0.55);
      --accent: #f0883e;
      --base: rgb(24, 26, 33);
      --glass-edge: rgba(255, 255, 255, 0.2);
      --border: rgba(255, 255, 255, 0.09);
      --hover: rgba(255, 255, 255, 0.07);
      --radius: 22px;
      --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--base);
      color: var(--text);
      font: 13px/1.3 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    /* The window is opaque, so the panel fills it edge to edge and the glass look is
       built from gradients over a solid base instead of a backdrop blur. */
    body { padding: 0; }

    .panel {
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        radial-gradient(120% 70% at 50% -10%, rgba(255, 255, 255, 0.10), transparent 60%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0) 40%),
        var(--base);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
      animation: panel-in 200ms ease-out both;
    }
    @keyframes panel-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .search {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .search svg {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      stroke: var(--dim);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .search input {
      pointer-events: auto;
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 17px;
      font-weight: 450;
      font-family: inherit;
      caret-color: var(--accent);
    }
    .search input::placeholder { color: var(--dim); }

    /* Keycap, shared by the search hint and the footer. */
    kbd {
      font: 500 11px/1 inherit;
      font-family: inherit;
      color: var(--dim);
      padding: 3px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.25);
    }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
    }
    .list::-webkit-scrollbar { width: 8px; }
    .list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 4px; }

    .row {
      --h: 210;
      position: relative;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    /* Selection is glass on glass, with an accent bar, rather than a solid fill. */
    .row.sel {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.08));
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 2px 8px rgba(0, 0, 0, 0.18);
    }
    .row.sel::before {
      content: "";
      position: absolute;
      left: -1px;
      top: 25%;
      bottom: 25%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
      box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent);
    }

    .glyph {
      width: 34px; height: 34px;
      flex: 0 0 auto;
      border-radius: 10px;
      /* Hue comes from the item name in main.js, matching the dock's tiles. */
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 52%),
        linear-gradient(150deg, hsl(var(--h) 68% 60%), hsl(calc(var(--h) + 28) 62% 38%));
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 650;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    .row-text { min-width: 0; flex: 1; }
    .row-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub { font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.sel .row-sub { color: rgba(255, 255, 255, 0.72); }

    /* A pill, so windows read differently from apps without shouting. */
    .kind {
      flex: 0 0 auto;
      font-size: 11px;
      color: var(--dim);
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
    }
    .row.sel .kind { color: var(--fg); background: rgba(255, 255, 255, 0.14); }

    .pin-btn {
      flex: 0 0 auto;
      background: transparent;
      border: none;
      color: var(--dim);
      font-size: 16px;
      line-height: 1;
      padding: 5px 7px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, transform 120ms var(--ease-out);
    }
    .pin-btn:hover { background: rgba(255, 255, 255, 0.14); color: var(--fg); transform: scale(1.12); }
    .pin-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* The filled star is the only indication of what is pinned, so it stays legible
       on the selected row rather than inheriting the dim colour. */
    .pin-btn.on { color: #f5c451; text-shadow: 0 0 8px rgba(245, 196, 81, 0.45); }
    .row.sel .pin-btn { color: rgba(255, 255, 255, 0.8); }
    .row.sel .pin-btn.on { color: #ffd76a; }

    .empty {
      padding: 36px 18px;
      text-align: center;
      color: var(--dim);
      font-size: 13px;
    }

    .footer {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 9px 20px;
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--dim);
    }
    .footer span { display: inline-flex; align-items: center; gap: 6px; }

    @media (prefers-reduced-motion: reduce) {
      .panel { animation: none; }
      .pin-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Search applications and running windows" autofocus spellcheck="false" />
      <kbd>Enter</kbd>
    </div>

    <div class="list" id="list"></div>

    <div class="footer">
      <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> Move</span>
      <span><kbd>Enter</kbd> Launch</span>
      <span><kbd>Ctrl</kbd><kbd>P</kbd> Pin</span>
      <span><kbd>Esc</kbd> Close</span>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
